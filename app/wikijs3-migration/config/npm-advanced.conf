# Nginx Proxy Manager > Proxy Host > Advanced 탭에 그대로 붙여 넣기
# - Details 탭: Scheme http / Forward IP·Port 는 아래 proxy_pass 와 동일하게
# - Websockets Support: ON, Cache Assets: OFF
#
# 주의: Advanced 에 proxy_set_header 만 따로 넣으면 NPM 이 만든 location / 에 가려져 적용되지 않는다.
#       아래처럼 location / 블록 전체를 넣어야 한다. (Advanced 에 location / 가 있으면 NPM 은 기본 location 을 만들지 않음)

# ── (선택) 같은 도메인에 정적 파일 서비스: 모바일 뷰어 등 ──
# location = /m { return 301 /m/; }
# location /m/ {
#     alias /data/wiki-m/;
#     index index.html;
#     add_header Cache-Control "no-cache";
# }

client_max_body_size 0;   # 업로드 크기 제한 해제 (.wkbackup 가져오기, 첨부)

location / {
    proxy_pass http://NAS_IP:3001;

    # Wiki.js 3 요구사항: X-Forwarded-Proto / Host / For (인증 콜백 URL, 감사 로그, 요청 제한)
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;      # NPM 에서 SSL 종료 → https 고정
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    # Websockets (/_collab 실시간 공동편집)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 대용량 가져오기·긴 요청 (기본 60초면 504 발생)
    proxy_connect_timeout 60s;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    send_timeout          3600s;

    # 업로드·스트리밍 응답을 모으지 않고 바로 전달 (가져오기, 내장 MCP /_mcp)
    proxy_request_buffering off;
    proxy_buffering         off;
}
